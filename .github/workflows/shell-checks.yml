name: Shell checks
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n tgweb-install.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning
